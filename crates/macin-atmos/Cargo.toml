[package]
name = "macin-atmos"
description = "Streaming ADM BWF and DAMF Atmos master authoring"
readme = "../../README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
macin-adm.workspace = true
macin-bwf.workspace = true
quick-xml.workspace = true
libm.workspace = true
renamore.workspace = true
saphyr-parser = { workspace = true, optional = true }

[features]
# DAMF reading and conversion. Off by default so writers keep their dependency graph.
read = ["dep:saphyr-parser"]

[lints]
workspace = true
