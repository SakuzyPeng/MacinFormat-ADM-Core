[workspace]
resolver = "3"
members = ["crates/macin-adm", "crates/macin-bwf", "crates/macin-atmos"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/SakuzyPeng/MacinFormat-ADM-Core"
publish = false

[workspace.dependencies]
macin-adm = { path = "crates/macin-adm", version = "0.1.0" }
macin-bwf = { path = "crates/macin-bwf", version = "0.1.0" }
libm = "=0.2.16"
quick-xml = { version = "=0.41.0", default-features = false }
renamore = "=0.3.2"

[workspace.lints.rust]
unsafe_code = "forbid"
